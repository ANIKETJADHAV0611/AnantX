---
- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Required Packages
  apt:
    name:
      - docker.io
      - docker-compose-v2
      - git
      - curl
      - unzip
    state: present

- name: Enable Docker
  service:
    name: docker
    enabled: yes
    state: started

- name: Add Ubuntu User To Docker Group
  user:
    name: ubuntu
    groups: docker
    append: yes
