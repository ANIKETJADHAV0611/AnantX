---
- name: Create AnantBuy application directory
  file:
    path: /opt/anantbuy
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Clone AnantBuy repository
  become: true
  become_user: ubuntu
  git:
    repo: "{{ anantbuy_repo }}"
    dest: /opt/anantbuy
    version: "{{ anantbuy_branch }}"  
    force: yes

- name: Create root .env
  template:
    src: root.env.j2
    dest: /opt/anantbuy/.env
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Create backend .env
  template:
    src: backend.env.j2
    dest: /opt/anantbuy/backend/.env
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Ensure monitoring network exists
  community.docker.docker_network:
    name: anant-monitoring
    state: present

- name: Build and start AnantBuy
  become: true
  become_user: ubuntu
  shell: docker compose up -d --build
  args:
    chdir: /opt/anantbuy  