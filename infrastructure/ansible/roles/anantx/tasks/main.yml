- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Clone AnantX repository
  git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: "{{ repo_branch }}"
    force: yes
  become_user: "{{ app_owner }}"

- name: Create backend .env
  template:
    src: backend.env.j2
    dest: "{{ app_dir }}/backend/.env"
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: "0644"

- name: Ensure monitoring network exists
  community.docker.docker_network:
    name: "{{ docker_network }}"
    state: present

- name: Build and start AnantX
  shell: docker compose up -d --build
  args:
    chdir: "{{ app_dir }}"
